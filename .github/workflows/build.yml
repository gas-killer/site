name: Build

on:
  pull_request:
    branches:
      - main
      - dev
      - staging

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Copy WASM
        run: npm run copy:wasm

      - name: Build
        run: npm run build
