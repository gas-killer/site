name: Delete Neon preview branch

# The Vercel integration creates `preview/<git-branch>` per PR but never deletes it on merge,
# so closed PRs exhaust the Neon project's branch limit.
on:
  pull_request:
    types: [closed]

jobs:
  delete:
    name: Delete preview branch
    runs-on: ubuntu-latest
    steps:
      - uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
