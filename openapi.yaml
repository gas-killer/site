openapi: 3.1.0
info:
  title: Gas Killer Router API
  version: 0.1.0
  description: >
    HTTP API for the Gas Killer router (the AVS aggregator).


    Clients submit compute tasks to `POST /trigger`; the router validates them,
    fans them out to EigenLayer operator nodes, aggregates the BLS signatures,
    and submits a single `verifyAndUpdate` transaction on-chain. Task submission
    is authenticated with an API key issued through the admin endpoints.
  contact:
    name: Gas Killer
    url: https://gaskiller.xyz
    email: contact@gaskiller.xyz

servers:
  - url: "{baseUrl}"
    description: Gas Killer router ingress
    variables:
      baseUrl:
        default: https://testnet.gaskiller.xyz
        enum:
          - https://testnet.gaskiller.xyz
          - http://localhost:8080
        description: >
          Base URL of the router ingress. Defaults to the public testnet; select
          localhost for local development, or replace with your own deployment.

tags:
  - name: Tasks
    description: Submitting compute tasks to the network.
  - name: Metadata
    description: Public AVS identity, consumed by the EigenLayer indexer.
  - name: Admin
    description: >
      API-key management. Guarded by the `ADMIN_KEY` shared secret; disabled
      (503 `NOT_CONFIGURED`) until that secret is set on the router.
  - name: Operations
    description: Liveness, readiness, and metrics probes.

paths:
  /trigger:
    post:
      tags: [Tasks]
      summary: Submit a compute task
      operationId: triggerTask
      description: >
        Queues a task for the operator network. The request is authenticated,
        load-shed against the queue capacity, then validated (field-level, then
        on-chain) before it is accepted. A `200` means the task was queued, not
        that it has settled on-chain.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GasKillerTaskRequest"
      responses:
        "200":
          description: Task accepted and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GasKillerTaskResponse"
              example:
                success: true
                message: Task queued
        "400":
          description: >
            The request body is malformed JSON, or it failed field-level
            validation. `code` is one of `INVALID_REQUEST`, `INVALID_ADDRESS`,
            `STALE_BLOCK`, `TRANSITION_MISMATCH`, `CALLDATA_TOO_LARGE`, or
            `CONTRACT_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: INVALID_ADDRESS
                  message: target_address is zero
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: >
            The request body is well-formed JSON but does not match the expected
            schema (for example, a field has the wrong type). Returned with code
            `INVALID_REQUEST`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: INVALID_REQUEST
                  message: Failed to deserialize the JSON body into the target type
        "502":
          description: An upstream RPC endpoint used for on-chain validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: RPC_UNAVAILABLE
                  message: An upstream RPC endpoint failed or is unreachable
        "503":
          description: >
            The service is at capacity (`QUEUE_FULL`) or task persistence is not
            configured (`NOT_CONFIGURED`). Retry after a short delay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: QUEUE_FULL
                  message: Service at capacity, please try again in a few minutes
        "500":
          $ref: "#/components/responses/InternalError"

  /avs-metadata:
    get:
      tags: [Metadata]
      summary: AVS identity metadata
      operationId: getAvsMetadata
      description: >
        Returns the AVS identity document in the exact shape the EigenLayer
        indexer expects (the URL registered via `updateAVSMetadataURI`). Public;
        no authentication required.
      responses:
        "200":
          description: AVS metadata document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvsMetadata"

  /admin/keys:
    post:
      tags: [Admin]
      summary: Issue an API key
      operationId: createApiKey
      description: >
        Creates a new API key for task submission. The raw `key` is returned
        exactly once and is never recoverable afterwards — store it securely.
      security:
        - AdminAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Key created. The `key` field is shown only in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        "400":
          description: The request body is invalid (e.g. `invalid_at` is in the past).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AdminNotConfigured"
    get:
      tags: [Admin]
      summary: List API keys
      operationId: listApiKeys
      description: >
        Lists metadata for all active API keys. Never returns the key value or
        its hash.
      security:
        - AdminAuth: []
      responses:
        "200":
          description: Active API keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKeyMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AdminNotConfigured"

  /admin/keys/{id}:
    delete:
      tags: [Admin]
      summary: Revoke an API key
      operationId: revokeApiKey
      description: Revokes the key with the given public identifier. Idempotent per key.
      security:
        - AdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The key's public identifier (the `id` field, not the secret).
          schema:
            type: string
      responses:
        "204":
          description: Key revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No key exists with that identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: NOT_FOUND
                  message: API key not found
        "503":
          $ref: "#/components/responses/AdminNotConfigured"

  /healthz:
    get:
      tags: [Operations]
      summary: Liveness probe
      operationId: healthz
      description: Always returns `200` while the process is running.
      responses:
        "200":
          description: The service is alive.

  /readyz:
    get:
      tags: [Operations]
      summary: Readiness probe
      operationId: readyz
      description: Returns `200` once the router is ready to accept traffic.
      responses:
        "200":
          description: The service is ready.
        "503":
          description: The service is not yet ready.

  /metrics:
    get:
      tags: [Operations]
      summary: Prometheus metrics
      operationId: metrics
      description: Exposes runtime metrics in the Prometheus text exposition format.
      responses:
        "200":
          description: Metrics in Prometheus text format.
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: >
        An API key issued via `POST /admin/keys`, sent as
        `Authorization: Bearer gk_...`.
    AdminAuth:
      type: http
      scheme: bearer
      description: >
        The router's `ADMIN_KEY` shared secret, sent as
        `Authorization: Bearer <ADMIN_KEY>`.

  responses:
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: UNAUTHORIZED
              message: Unauthorized
    AdminNotConfigured:
      description: The admin API is not configured (`ADMIN_KEY` is unset).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: NOT_CONFIGURED
              message: Admin API is not configured (set ADMIN_KEY)
    InternalError:
      description: An unexpected server-side error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: INTERNAL
              message: "Internal error: task queue unavailable"

  schemas:
    Address:
      type: string
      pattern: "^0x[0-9a-fA-F]{40}$"
      description: A 20-byte Ethereum address, 0x-prefixed hex.
      examples:
        - "0x0000000000000000000000000000000000000001"

    GasKillerTaskRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          $ref: "#/components/schemas/GasKillerTaskRequestBody"

    GasKillerTaskRequestBody:
      type: object
      additionalProperties: false
      required: [target_address, from_address, call_data, value, block_height]
      properties:
        target_address:
          allOf:
            - $ref: "#/components/schemas/Address"
          description: The contract the computation is executed against.
        from_address:
          allOf:
            - $ref: "#/components/schemas/Address"
          description: The address the simulated call is sent from.
        call_data:
          type: array
          description: >
            ABI-encoded calldata as an array of byte values (0–255). The first
            four bytes are the function selector, so at least 4 bytes are
            required; the maximum accepted size is 128 KiB.
          items:
            type: integer
            minimum: 0
            maximum: 255
          minItems: 4
          maxItems: 131072
          examples:
            - [171, 205, 239, 1]
        value:
          type: string
          pattern: "^0x[0-9a-fA-F]+$"
          description: Wei value to attach to the call, as a 0x-prefixed hex uint256.
          examples:
            - "0x0"
        block_height:
          type: integer
          format: int64
          minimum: 1
          description: The block height the computation is pinned to.
          examples:
            - 1
        transition_index:
          description: >
            The state-transition slot to occupy. Send an integer to target a
            specific slot, or `"auto"` / `null` / omit the field to let the
            router resolve the next available slot at dequeue time (which is what
            makes safe parallel submissions possible).
          default: auto
          anyOf:
            - type: integer
              format: int64
              minimum: 0
            - type: string
              const: auto
            - type: "null"

    GasKillerTaskResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
      examples:
        - success: true
          message: Task queued

    AvsMetadata:
      type: object
      required: [name, website, description]
      properties:
        name:
          type: string
        website:
          type: string
          format: uri
        description:
          type: string
        logo:
          type: string
          format: uri
        twitter:
          type: string
        operatorSets:
          type: array
          items:
            $ref: "#/components/schemas/AvsOperatorSetMetadata"

    AvsOperatorSetMetadata:
      type: object
      required: [name, id, description, software]
      properties:
        name:
          type: string
        id:
          type: string
        description:
          type: string
        software:
          type: array
          items:
            $ref: "#/components/schemas/AvsOperatorSetSoftware"
        slashingConditions:
          type: array
          items:
            type: string

    AvsOperatorSetSoftware:
      type: object
      required: [name, description, url]
      properties:
        name:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri

    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      description: >
        All fields are optional; an empty body creates an unlabeled key that
        never expires.
      properties:
        label:
          type: [string, "null"]
          description: A human-readable label for the key.
        invalid_at:
          type: [integer, "null"]
          format: int64
          description: >
            Unix timestamp (seconds) at which the key stops authenticating. Must
            be in the future. Omit or send `null` for a key that never expires.

    CreatedApiKey:
      type: object
      required: [id, key, created_at]
      properties:
        id:
          type: string
          description: Public identifier for the key, used in listings and revocation.
        key:
          type: string
          description: >
            The raw API key (`gk_` followed by 64 hex characters). Returned only
            once, on creation; it is stored hashed and cannot be recovered.
          examples:
            - "gk_1a2b3c..."
        label:
          type: [string, "null"]
        created_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the key was created.
        invalid_at:
          type: [integer, "null"]
          format: int64
          description: Unix timestamp (seconds) when the key expires, or null if never.

    ApiKeyMetadata:
      type: object
      required: [id, created_at]
      description: Non-secret metadata about an active key. Never includes the key value.
      properties:
        id:
          type: string
        label:
          type: [string, "null"]
        created_at:
          type: integer
          format: int64
        last_used:
          type: [integer, "null"]
          format: int64
          description: Unix timestamp (seconds) of the key's most recent use, if any.
        invalid_at:
          type: [integer, "null"]
          format: int64

    ErrorEnvelope:
      type: object
      required: [error]
      description: The wire shape of every error response.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string

    ErrorCode:
      type: string
      description: >
        A stable machine-readable error identifier. `RATE_LIMITED` is reserved
        for future use and is not currently emitted by any endpoint.
      enum:
        - INVALID_ADDRESS
        - STALE_BLOCK
        - TRANSITION_MISMATCH
        - CALLDATA_TOO_LARGE
        - RATE_LIMITED
        - QUEUE_FULL
        - UNAUTHORIZED
        - RPC_UNAVAILABLE
        - CONTRACT_NOT_FOUND
        - INVALID_REQUEST
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - NOT_CONFIGURED
        - INTERNAL
